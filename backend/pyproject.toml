[project]
name = "backend"
version = "0.1.0"
description = "PundraNoticeLens — Photo to structured notice extraction pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docaligner-docsaid>=1.1.1",
    "capybara-docsaid>=0.12.0",
    "datalab-python-sdk",
    "langchain-google-genai",
    "langchain-groq>=1.1.3",
    "Pillow",
    "pydantic",
    "streamlit>=1.66.0",
    "pymupdf>=1.28.2",
    "gtts>=2.2.4",
    "jiwer>=4.0.0",
    "scikit-learn>=1.9.1",
    "python-dotenv>=1.2.4",
    "pytest>=9.1.1",
    "fastapi>=0.145.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

